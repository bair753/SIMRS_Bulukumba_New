<style>
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }

    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }

    .label-primary {
        background-color: #337ab7;
    }

    .label-danger {
        background-color: #ba0d1b
    }

        text-align: center;
    }

        display: inline;

<div id="tempatLaporan" ng-hide="istempatLaporan"></div>
<div class="grid_12 headerBox">
    <h1 style="color: white;"><b>Daftar Registrasi Pasien Farmasi</b></h1>
</div>
<div class="grid_12">
    <div class="grid_12 borderBox containerBorderBox">
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Instalasi"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.instalasi" k-data-text-field="'departemen'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartemen"
                    k-on-change='getIsiComboRuangan()' />
            </div>
        </div>
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Ruangan"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan" k-data-text-field="'ruangan'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuangan" />
            </div>
        </div>
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Kelompok"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokpasien"
                    k-data-text-field="'kelompokpasien'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listKelompokPasien" />
            </div>
        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()">Cari</button>
            </div>
        </div>
    </div>
</div>
<div class="grid_12">
    <div class="grid_12 headerBox">
        <p>Daftar Pasien</p>
    </div>
    <div class="clear"></div>
    <div class="grid_12 borderBox">
        <kendo-grid id="kGrid" data-source="dataDaftarPasienPulang" options="columnDaftarPasienPulang"
            k-selectable="'row'" k-sortable="'true'" k-resizable="'true'" k-ng-model="dataPasienSelected"
            ng-click="klikGrid(dataPasienSelected)"></kendo-grid>
    </div>
</div>
<div class="grid_12">
    <div class="grid_1">
        <div class="grid_12">
            <label c-label item="item">No Reg</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noReg"
                ng-keypress="($event.which == 13)? SearchData():item.noReg" />
        </div>
    </div>
    <div class="grid_1">
        <div class="grid_12">
            <label c-label item="item">No RM</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noRm"
                ng-keypress="($event.which == 13)? SearchData():item.noRm" />
        </div>
    </div>
    <div class="grid_2">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Nama"></label>
        </div>
        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nama"
                ng-keypress="($event.which == 13)? SearchData():item.nama" />
        </div>
    </div>
    <div class="grid_1">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Rows"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.jmlRows" />
        </div>
    </div>
    <div class="grid_1">
        <div class="grid_12">
            <label>&nbsp;</label>
        </div>
        <div class="grid_12">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="DaftarResepBpjs()">Dafar Resep Bpjs</button>
        </div>
    </div>
    <div class="grid_1">
        <div class="grid_12">
            <label>&nbsp;</label>
        </div>
        <div class="grid_12">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="CetakSEP()">Cetak SEP</button>
        </div>
    </div>
</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
<div kendo-window="popUpdataAddOns" k-title="'Rincian Resep'" k-width="500" k-visible="false"
    k-on-open="win2visible = true" k-on-close=" win2visible=false">
    <div class="grid_2" ng-hide="hidebpjs">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Jenis Obat Apotik Online"></label>
        </div>
        <div class="grid_12">
            <input kendo-combo-box k-ng-model="selectedItem.jenisObat" k-data-text-field="'jenisobat'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisObat" />
        </div>
    </div>
    <div class="grid_2" ng-hide="hidebpjs">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Iterasi"></label>
        </div>
        <div class="grid_12">
            <input kendo-combo-box k-ng-model="selectedItem.iterasi" k-data-text-field="'iterasi'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listIterasi" />
        </div>
    </div>
    <div class="grid_12" style="margin-top: 25px;">
        <button class="k-button k-primary  k-button-icontext" ng-click="saveData()">
            <span class="k-icon fa fa-save"></span>Save Data</button>
        <!-- <button ng-click="saveData()">Save</button> -->
    </div>
</div>
<div class="grid_12">
    <div kendo-window="popUpLayanan" k-title="'Rincian Resep'" k-width="1300" k-visible="false"
        k-on-open="win2visible = true" k-on-close=" win2visible=false">
        <div class="panel panel-default container_12" style="padding: 0px 10px;">
            <div class="grid_12 ">
                <kendo-grid id="kGrid2" data-source="sourceRincians" options="columnRincians" k-selectable="'row'"
                    k-sortable="'true'" k-resizable="'true'" k-groupable="true" k-pageable="true"
                    k-ng-model="dataSelectedRincian" ng-click="klikRincian(dataSelectedRincian)">
                </kendo-grid>
            </div>
            <div class="grid_12">
                <div class="grid_4">
                    <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                        <button class="k-button k-primary  k-button-icontext" ng-click="cetakResepDokterFull()">
                            <span class="k-icon fa fa-edit"></span>Cetak Resep</button>
                    </div>
                </div>
                <div class="grid_4">
                    <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                        <button class="k-button k-primary  k-button-icontext" ng-click="kirimOnline()">
                            <span class="k-icon fa fa-edit"></span>Kirim Online</button>
                    </div>
                </div>
                <div class="grid_4">
                    <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                        <button class="k-button k-primary  k-button-icontext" ng-click="simpanSkrining()">
                            <span class="k-icon fa fa-edit"></span>Cetak Bill Resep</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- pop up ceklis 5 benar -->
<div kendo-window="popupLimaBenar" k-title="'Ceklis Prinsip 5 Benar'" k-visible="false" k-width="550">
    <div class="panel panel-default container_12">
        <div class="grid_12" ng-repeat="list in listPrinsipBesar | orderBy:'id'" style="margin-top: 10px;">
            <div ng-repeat="opsi in list.detail | orderBy:'id'" style="margin-top: 5px;">
                <div class="grid_6">
                    <input type="checkbox" ng-checked="opsi.isChecked" class="k-checkbox" name="{{opsi.nama}}"
                        id="{{opsi.nama}}" ng-model="bool" value="{{opsi.id}}"
                        ng-click="addListPrinsipBesar(bool,opsi)">
                    <label class="k-checkbox-label" for="{{opsi.nama}}">{{opsi.nama}}</label>
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="k-edit-buttons k-state-default pull-right" style="margin-top:10px">
                <button class="k-button k-primary k-button-icontext" ng-click="lanjutSimpanSkriningnew()"
                    ng-hide="isShowOrder">Simpan</button>
                <button class="k-button k-button-icontext" ng-click="closeSkrining()">Batal</button>
            </div>
        </div>
    </div>
</div>
<!-- pop up ceklis 5 benar -->

<!-- Get Daftar Resep Bpsj -->
<div kendo-window="PopUpDaftarResepBpjs" k-title="'Daftar Resep Bpjs'" k-visible="false" k-width="1280" k-height="500">
    <div class="grid_12">
        <div class="grid_2" ng-hide="hidebpjs">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Jenis Obat Apotik Online"></label>
            </div>
            <div class="grid_12">
                <input kendo-combo-box k-ng-model="item.jenisObat" k-data-text-field="'jenisobat'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisObat" />
            </div>
        </div>
        <div class="grid_2" ng-hide="hidebpjs">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Jenis Obat Apotik Online"></label>
            </div>
            <div class="grid_12">
                <input kendo-combo-box k-ng-model="item.JnsTgl" k-data-text-field="'jenistgl'" k-data-value-field="'id'"
                    k-filter="'contains'" k-auto-bind="false" k-data-source="JnsTgl" />
            </div>
        </div>
        <div class="grid_4" style="margin-top: -7px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Tgl Mulai" real></label>
            </div>
            <div class="grid_12 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker k-max="now"
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>
        </div>
        <div class="grid_4" style="margin-top: -7px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Tgl Akhir" real></label>
            </div>
            <div class="grid_12 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
            </div>
        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-click="GetDaftarResepBpjs()">Cari</button>
            </div>
        </div>
    </div>
    <div class="grid_12" style="margin-top: 4rem">
        <div class="grid_12 headerBox">
            <p>Daftar Resep Bpjs</p>
        </div>
        <div class="clear"></div>
        <div class="grid_12 borderBox">
            <!-- <kendo-grid id="kGrid3" k-data-source="dataObatBpjs" k-options="columnObatBpjs"
                k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                k-ng-model="dataObatBpjs"
                ng-click="klikGridBpjs(dataObatBpjs)">
            </kendo-grid> -->
            <kendo-grid id="kGrid2" data-source="dataObatBpjs" options="columnObatBpjs" k-selectable="'row'"
                k-sortable="'true'" k-resizable="'true'" k-groupable="true" k-pageable="true" k-ng-model="dataKlikBpjs"
                ng-click="klikBpjs(dataKlikBpjs)">
        </div>
    </div>
    <div class="grid_12">
        <div class="k-edit-buttons k-state-default pull-right" style="margin-top:10px">
            <button class="k-button k-primary k-button-icontext" ng-click="DeleteOnline()">
                <span class="k-icon fa fa-edit"></span>Delete Online</button>
        </div>
    </div>
</div>
