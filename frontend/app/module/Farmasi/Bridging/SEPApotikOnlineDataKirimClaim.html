<div id="tempatLaporan" ng-hide="istempatLaporan"></div>
<div class="grid_12 headerBox">
    <h1 style="color: white;"><b>Daftar Registrasi Pasien Farmasi</b></h1>
</div>
<div class="grid_12">
    <div class="grid_12 borderBox containerBorderBox">
        <div class="grid_4">
				<div class="grid_12">
					<label c-label item="item" c-label-text="Periode Registrasi"></label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<!-- AwalPeriode -->
					<div class="grid_6 padDatePicker">
						<input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker
							placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
					</div>

					<!-- AkhirPeriode -->
					<div class="grid_6 padDatePicker">
						<input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
							placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
					</div>
					<div class="clear"></div>
				</div>
			</div>

        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Instalasi"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.instalasi" k-data-text-field="'departemen'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartemen"
                    k-on-change='getIsiComboRuangan()' />
            </div>
        </div>
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Ruangan"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan" k-data-text-field="'ruangan'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuangan" />
            </div>
        </div>
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Kelompok"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokpasien"
                    k-data-text-field="'kelompokpasien'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listKelompokPasien" />
            </div>
        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()">Cari</button>
            </div>
        </div>
    </div>
</div>
<div class="grid_12">
    <div class="grid_12 headerBox">
        <p>Daftar Pasien</p>
    </div>
    <div class="clear"></div>

</div>

<div kendo-window="popUpTTD" k-title="'Tanda Tangani Dokumen'" k-width="800" k-visible="false" k-on-open="win2visible = true"
    k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <fieldset>
            <legend><label c-label item="item"> Dokumen</label></legend>

            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">Dokter</label>
                </div>
                <div class="grid_9">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.pegawai"
                        k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listPegawaiBsre" k-on-change="changeTTD(item.pegawai)" disabled />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">NIK</label>
                </div>
                <div class="grid_7">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nik" />
                </div>
                <div class="grid_2" style="margin-top: 5px;">
                    <button class="k-button k-button-icontext k-primary k-grid-update"
                        ng-click="cekUser()" id="btnSimpanCek"><span class="k-icon k-update"></span>Cek User</button>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">Pass Phrase</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="password" filter="" class="k-textbox" ng-model="item.passphrase" autocomplete="off" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">Nama Dokumen</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namadokumen" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">Dokumen</label>
                </div>
                <div class="grid_9">
                    <div class="grid_4" style="margin-top: 5px;">
                        <button class="k-button k-button-icontext k-primary success k-grid-update"
                            ng-click="lihatDok()" id="btnLihatDok"><span class="fa fa-eye"></span>&nbsp;Lihat Dokumen</button>
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <label c-label item="item">Keterangan</label>
                </div>
                <div class="grid_9">
                    <textarea class="k-textbox" style="height: 76px; width: 100%; resize: none;"
                        ng-model="item.reason"></textarea>
                </div>
            </div>
        </fieldset>

        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
            <button class="k-button k-button-icontext k-primary k-grid-update" ng-disabled="disabledSimpan2"
                ng-click="SaveUpdate()" id="btnSimpan2"><span class="k-icon k-update"></span>Tanda Tangani</button>
            <button class="k-button  k-button-icontext" ng-disabled="disabledBatal" ng-click="batal()"
                id="btnBatal2"><span class="k-icon k-cancel"></span>Batal</button>
        </div>
    </div>
</div>

<div kendo-window="popUpDoneVerif" k-title="'Detail'" k-width="1200" k-visible="false" k-on-open="win2visible = true"
    k-on-close="win2visible = false">
    <div class="panel panel-default container_12">
        <md-content class="md-padding">
            <div class="grid_12">
                <div class="grid_6">
                    <div class="grid_6"><label c-label item="item">Summary</label></div>
                    <div class="grid_6"><label>: {{ verify.conclusion }}</label></div>
                </div>
                <div class="grid_6">
                    <div class="grid_6"><label c-label item="item">Notes</label></div>
                    <div class="grid_6"><label>: {{ verify.description }}</label></div>
                </div>
            </div>
            <hr>
            <div class="grid_12">
                <fieldset>
                    <legend><label c-label item="item"> Info Signer</label></legend>
                    <div class="grid_12" ng-repeat="signature in verify.signatureInformations">
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Signer Name</label></div>
                            <div class="grid_6"><label>: {{ signature.signerName }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Signature Date</label></div>
                            <div class="grid_6"><label>: {{ signature.signatureDate | date:'yyyy-MM-dd HH:mm:ss' }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Location</label></div>
                            <div class="grid_6"><label>: {{ signature.location }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Reason</label></div>
                            <div class="grid_6"><label>: {{ signature.reason }}</label></div>
                        </div>
                    </div>
                </fieldset>
            </div>
            <hr>
            <div class="grid_12">
                <fieldset>
                    <legend><label c-label item="item">Certificate Details</label></legend>
                    <div class="grid_12" ng-repeat="cert in verify.signatureInformations[0].certificateDetails">
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Common Name</label></div>
                            <div class="grid_6"><label>: {{ cert.commonName }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Issuer Name</label></div>
                            <div class="grid_6"><label>: {{ cert.issuerName }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Serial Number</label></div>
                            <div class="grid_6"><label>: {{ cert.serialNumber }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Valid From</label></div>
                            <div class="grid_6"><label>: {{ cert.notBeforeDate | date:'yyyy-MM-dd' }}</label></div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6"><label c-label item="item">Valid Until</label></div>
                            <div class="grid_6"><label>: {{ cert.notAfterDate | date:'yyyy-MM-dd' }}</label></div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </md-content>
    </div>
</div>
