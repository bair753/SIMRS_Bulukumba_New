<style type="text/css">
    .json-viewer {
        margin-top: 26px;
        padding: 2em 0 2em 5em;
        background: lightgrey;
    }
</style>

<div class="grid_12">
    <div class="panel panel-default panel-white">
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_12">

                    <div class="panel panel-default">
                        <div class="panel-heading " style="font-size: 18px; "><span c-translate>Monitoring</span>
                            <span class="icon fa fa-chevron-circle-down " ng-show="!isShowPotensi " style="right:10px
                                                                                " ng-click="showPotensi() "></span>
                            <span class="icon fa fa-chevron-circle-up " ng-show="isShowPotensi " style="right:10px
                                                                                " ng-click="showPotensi() "></span>
                        </div>
                        <div class="panel-body " ng-show="isShowPotensi ">
                            <div class="grid_12 animated no-padding ">
                                <div ng-cloak>
                                    <md-content>
                                        <md-tabs md-dynamic-height md-border-bottom>
                                            <md-tab label="Data Klaim">
                                                <md-content class="md-padding">
                                                    <div class="panel panel-default container_12">
                                                        <div class="panel-body">
                                                            <!-- FILTER -->
                                                            <div class="grid_12">

                                                                <div class="grid_2">
                                                                    <label>Bulan</label>
                                                                    <input style="width:100%"
                                                                        kendo-date-picker
                                                                        k-options="monthUngkul"
                                                                        k-ng-model="klaim.bulan"
                                                                        k-format="'MMMM'" />
                                                                </div>

                                                                <div class="grid_2">
                                                                    <label>Tahun</label>
                                                                    <input style="width:100%"
                                                                        kendo-date-picker
                                                                        k-options="yearUngkul"
                                                                        k-ng-model="klaim.tahun"
                                                                        k-format="'yyyy'" />
                                                                </div>

                                                                <div class="grid_2">
                                                                    <label>Status</label>
                                                                    <input style="width:100%;"
                                                                        kendo-combo-box
                                                                        k-ng-model="klaim.statusKlaim"
                                                                        k-data-text-field="'nama'"
                                                                        k-data-value-field="'id'"
                                                                        k-filter="'contains'"
                                                                        k-auto-bind="false"
                                                                        k-data-source="listStatusKlaim" />
                                                                </div>

                                                                <div class="grid_2">
                                                                    <label>Jenis Obat</label>
                                                                    <input style="width:100%;"
                                                                        kendo-combo-box
                                                                        k-ng-model="klaim.jenisobat"
                                                                        k-data-text-field="'nama'"
                                                                        k-data-value-field="'id'"
                                                                        k-filter="'contains'"
                                                                        k-auto-bind="false"
                                                                        k-data-source="listJenisObat" />
                                                                </div>

                                                                <div class="grid_2" style="margin-top:12px;text-align:right">
                                                                    <div class="grid_6">
                                                                        <button class="k-button k-primary" ng-click="findKlaim(klaim)">Cari</button>
                                                                    </div>
                                                                    <div class="grid_6">
                                                                        <button class="k-button" ng-click="clear()">Clear</button>
                                                                    </div>
                                                                </div>

                                                            </div>

                                                            <div class="clear"></div>
                                                            <br>

                                                            <!-- SUMMARY -->
                                                            <div class="grid_12">

                                                                <table class="table table-bordered">
                                                                    <tr style="font-weight:bold;">
                                                                        <td width="20%">Jumlah Data</td>
                                                                        <td width="30%">{{jumlahData}}</td>

                                                                        <td width="20%">Total Pengajuan</td>
                                                                        <td width="30%">
                                                                            {{totalBiayaPengajuan | number:0}}
                                                                        </td>
                                                                    </tr>

                                                                    <tr style="font-weight:bold;">
                                                                        <td>Total Disetujui</td>
                                                                        <td>
                                                                            {{totalBiayaSetuju | number:0}}
                                                                        </td>

                                                                        <td></td>
                                                                        <td></td>
                                                                    </tr>
                                                                </table>

                                                            </div>

                                                            <div class="clear"></div>

                                                            <!-- GRID -->
                                                            <div class="grid_12">

                                                                <div class="headerBox">
                                                                    <p>Daftar Klaim Apotek</p>
                                                                </div>

                                                                <div class="borderBox">

                                                                    <kendo-grid
                                                                        id="kGrid"
                                                                        data-source="dataDaftarPasienPulang"
                                                                        options="columnDaftarPasienPulang"
                                                                        k-selectable="'row'"
                                                                        k-sortable="true"
                                                                        k-resizable="true"
                                                                        k-pageable="true"
                                                                        k-ng-model="dataPasienSelected">
                                                                    </kendo-grid>

                                                                </div>

                                                            </div>

                                                        </div>
                                                    </div>

                                                </md-content>
                                            </md-tab>
                                            <md-tab label="Rekap Peserta PRB">
                                                <md-content class="md-padding">
                                                    <div class="panel panel-default container_12">
                                                        <div class="panel-body">
                                                            <div class="grid_12">
                                                                <div class="grid_6">
                                                                    <div class="grid_12">
                                                                        <div class="grid_4">
                                                                            <label c-label>Bulan :</label>
                                                                            <input style="width: 100%" k-options="monthUngkul" k-ng-model="PRB.bulan"
                                                                                kendo-date-picker placeholer="MMMM" k-format="'MMMM'" />
                                                                        </div>
                                                                        <div class="grid_4">
                                                                            <label c-label>Tahun :</label>
                                                                            <input style="width: 100%" k-options="yearUngkul" k-ng-model="PRB.tahun" kendo-date-picker
                                                                                placeholer="YYYY" k-format="'yyyy'" />
                                                                        </div>
                                                                        <div class="grid_1">
                                                                            <button style="margin-top:20px;" class="k-button k-primary k-button-icon" ng-click="findPRB(PRB)"><span
                                                                                    class="k-sprite k-icon k-i-search">Find</span></button>
                                                                        </div>
                                                                    </div>

                                                                </div>
                                                                <div class="grid_6">
                                                                    <div class="grid_12">
                                                                        <label c-label>Results :</label>
                                                                    </div>
                                                                    <pre id="jsonPRB" class="json-viewer"></pre>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                </md-content>
                                            </md-tab>
                                        </md-tabs>
                                    
                                    </md-content>
                                    
                                 
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div ng-include=' "../app/template/Shared/TemplateLoading" '></div>
